services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desk_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-desk_companion}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_AUTH_RETURN_RESET_TOKEN_FOR_TESTING: ${APP_AUTH_RETURN_RESET_TOKEN_FOR_TESTING:-false}
      APP_AUTH_DEMO_VERIFICATION_CODE: ${APP_AUTH_DEMO_VERIFICATION_CODE:-1234}
      # Ollama runs as a separate container published on the host's 11434.
      # From inside this container, localhost is the container itself, so reach
      # the host gateway instead (extra_hosts maps host.docker.internal on Linux).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: desk_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-desk_companion}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
