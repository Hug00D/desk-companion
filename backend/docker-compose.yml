services:
  db:
    image: postgres:17
    container_name: desk_db
    environment:
      POSTGRES_DB: desk_companion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d desk_companion"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: