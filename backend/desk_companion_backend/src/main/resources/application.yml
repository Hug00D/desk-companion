server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:desk_companion}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    return-reset-token-for-testing: true
    demo-verification-code: ${APP_AUTH_DEMO_VERIFICATION_CODE:1234}
  assistant:
    ollama-base-url: ${OLLAMA_BASE_URL:${ASSISTANT_SERVICE_URL:http://localhost:11434}}
    model: ${OLLAMA_MODEL:qwen2.5:7b}
    chat-temperature: ${OLLAMA_CHAT_TEMPERATURE:0.8}
    chat-num-predict: ${OLLAMA_CHAT_NUM_PREDICT:256}
    request-timeout-seconds: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:60}
    decide-temperature: ${OLLAMA_DECIDE_TEMPERATURE:0.15}
    decide-num-predict: ${OLLAMA_DECIDE_NUM_PREDICT:48}
    decide-timeout-seconds: ${OLLAMA_DECIDE_TIMEOUT_SECONDS:60}
